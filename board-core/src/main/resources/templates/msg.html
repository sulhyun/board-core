<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
	<script th:inline="javascript">
		let msg = /*[[${msg}]]*/'';
		let url = /*[[@{${url}}]]*/'';
		let type = /*[[${windows} ? windows : '']]*/ '';
		
		if (msg != "") {
			alert(msg);
		}
		
		if (type != "") {
			window.close();
		} else {
			location.href = url;
		}
	</script>
</body>
</html>
