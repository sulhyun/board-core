<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{layout/layout}">
<head>
	<meta charset="UTF-8">
	<title layout:fragment="title">커뮤니티 : 게시글 목록</title>
</head>
<body>
	<main layout:fragment="content">
		<div class="mt-3">
			<a class="btn btn-outline-dark mr-2 mb-1"
			   th:each="community : ${cList}"
			   th:text="${community.co_name}"
			   th:href="@{/post/list/{co_num}(co_num=${community.co_num})}"
			   th:classappend="${pm.cri.co_num} == ${community.co_num} ? 'active' : ''"></a>
		</div>
		<div class="mt-4">
			<table class="table table-striped">
				<thead>
					<tr>
						<th>번호</th>
						<th>제목</th>
						<th>작성자</th>
						<th>조회수</th>
					</tr>
		    	</thead>
		    	<tbody>
		    		<tr th:each="post : ${pList}">
		    			<td th:text="${post.po_num}"></td>
		    			<td>
		    				<a th:text="${post.po_title}"></a>
		    			</td>
		    			<td th:text="${post.po_me_id}"></td>
		    			<td th:text="${post.po_view}"></td>
		    		</tr>
		    		<tr th:if="${pList.size() == 0}">
						<td colspan="4" class="text-center"><b>등록된 게시글이 없습니다.</b><td>
					</tr>
		    	</tbody>
			</table>
			<ul class="pagination justify-content-center" th:object="${pm}" th:if="${pm.endPage != 0}">
	   			<li class="page-item" th:if="*{prev}">
	   				<a class="page-link" th:href="@{/post/list/{co_num}(page=*{startPage - 1}, co_num=*{cri.co_num})}">이전</a>
	   			</li>
			    <li class="page-item" 
			    	th:each="i : *{#numbers.sequence(startPage, endPage)}"
			    	th:classappend="*{cri.page} == ${i} ? 'active' : ''">
			   	 	<a class="page-link" th:href="@{/post/list/{co_num}(page=${i}, co_num=*{cri.co_num})}" th:text="${i}">1</a>
			    </li>
			    <li class="page-item" th:if="*{next}">
			   		<a class="page-link" th:href="@{/post/list/{co_num}(page=*{endPage + 1}, co_num=*{cri.co_num})}">다음</a>
			    </li>
	  		</ul>
		</div>
	</main>
</body>
</html>
