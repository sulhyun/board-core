<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{layout/layout}">
<head>
	<meta charset="UTF-8">
	<title layout:fragment="title">커뮤니티 : 게시글 목록</title>
</head>
<body>
	<main layout:fragment="content">
		<div class="mt-3">
			<a class="btn btn-outline-dark mr-2 mb-1"
			   th:each="community : ${communities}"
			   th:text="${community.co_name}"
			   th:href="@{/post/list/{co_num}(co_num=${community.co_num})}"></a>
		</div>
	</main>
</body>
</html>
