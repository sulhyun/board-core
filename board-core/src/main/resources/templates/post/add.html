<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{layout/layout}">
<head>
	<meta charset="UTF-8">
	<title layout:fragment="title">커뮤니티 : 게시글 등록</title>
	<style type="text/css">
		.box {max-width: 650px; margin: 20px auto 0;}
		.error {color: red; border-color: red;}
	</style>
</head>
<body>
	<main layout:fragment="content">
		<div class="box">
			<div class="py-2 text-center">
				<h2>게시글 등록</h2>
			</div>
			<form th:action="@{/post/add}" th:object="${post}" method="post">
				<div class="form-group">
					<label for="writer">작성자</label>
					<input type="text" class="form-control" id="writer" name="po_me_id" th:value="${session.loginMember.me_id}"  readonly>
				</div>
				<div class="form-group">
					<label for="title">제목</label>
					<input type="text" class="form-control" id="title" th:field="*{po_title}" placeholder="제목을 입력하세요.">
				</div>
				<div class="form-group">
					<label for="content">내용</label>
					<textarea class="form-control" id="content" th:field="*{po_content}" placeholder="내용을 입력하세요." style="min-height: 400px; height: auto"></textarea>
				</div>
				<input type="hidden" name="po_co_num" th:value="${co_num}">
				<button class="btn btn-outline-dark col-12 mb-2">등록</button>
			</form>
		</div>
	</main>
</body>
</html>
