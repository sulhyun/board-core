<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{layout/layout}">
<head>
	<meta charset="UTF-8">
	<title layout:fragment="title">커뮤니티 : 로그인</title>
	<style type="text/css">
		.box {max-width: 540px; margin: 140px auto 0; border: 1px solid gray; border-radius: 20px; padding: 20px;}
	</style>
</head>
<body>
	<main layout:fragment="content">
		<div class="box">
			<div class="py-2 text-center">
				<h2>로그인</h2>
			</div>
			<form th:action th:object="${member}" method="post">
				<div class="form-group">
					<label for="id">아이디</label>
					<input type="text" class="form-control" id="id" name="id" th:field="*{id}" placeholder="아이디를 입력하세요.">
				</div>
				<div class="form-group">
					<label for="pw">비밀번호</label>
					<input type="password" class="form-control" id="pw" name="pw" th:field="*{pw}" placeholder="비밀번호를 입력하세요.">
				</div>
				<div class="mt-5">
					<button type="submit" class="btn btn-outline-dark col-12">로그인</button>
				</div>
			</form>
		</div>
	</main>
</body>
</html>
