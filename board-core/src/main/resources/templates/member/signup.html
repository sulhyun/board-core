<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{layout/layout}">
<head>
	<meta charset="UTF-8">
	<title layout:fragment="title">커뮤니티 : 회원가입</title>
	<style type="text/css">
		.box {max-width: 540px; margin: 60px auto 0; border: 1px solid gray; border-radius: 20px; padding: 20px;}
		.error {color: red; border-color: red;}
	</style>
</head>
<body>
	<main layout:fragment="content">
		<div class="box">
			<div class="py-2 text-center">
				<h2>회원가입</h2>
			</div>
			<form th:action th:object="${member}" method="post">
				<div class="form-group">
					<label for="id">아이디</label>
					<input type="text" class="form-control" th:errorClass="error" id="id" name="id" th:field="*{id}" placeholder="아이디를 입력하세요.">
					<div class="error" th:errors="*{id}">[Field]아이디 에러 메시지</div>
				</div>
				<div class="form-group">
					<label for="pw">비밀번호</label>
					<input type="password" class="form-control" th:errorClass="error" id="pw" name="pw" th:field="*{pw}" placeholder="비밀번호를 입력하세요.">
					<div class="error" th:errors="*{pw}">[Field]비밀번호 에러 메시지</div>
				</div>
				<div class="form-group">
					<label for="pw2">비밀번호 확인</label>
					<input type="password" class="form-control" th:errorClass="error" id="pw2" name="pw2" th:field="*{pw2}" placeholder="비밀번호를 재입력하세요.">
					<div class="error" th:errors="*{pw2}">[Field]비밀번호 확인 에러 메시지</div>
				</div>
				<div class="form-group">
					<label for="email">이메일</label>
					<input type="text" class="form-control" th:errorClass="error" id="email" name="email" th:field="*{email}" placeholder="이메일을 입력하세요.">
					<div class="error" th:errors="*{email}">[Field]이메일 에러 메시지</div>
				</div>
				<div class="mt-5">
					<button type="submit" class="btn btn-outline-dark col-12">회원가입</button>
				</div>
			</form>
		</div>
	</main>
</body>
</html>
